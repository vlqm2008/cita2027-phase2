[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "cita2027"
version = "0.1.0"
description = "Auditable financial return data pipeline for frozen TSFM calibration research"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "exchange-calendars>=4.5,<5",
]

[project.optional-dependencies]
download = ["yfinance>=0.2.65,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
cita-data = "cita2027.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
